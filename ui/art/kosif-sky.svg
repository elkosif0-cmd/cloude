<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <!-- KOSIF sky — vector recreation of the Canva-generated artwork (media MAHWPvhoRuY):
       bright cumulus over a sky that deepens to KOSIF navy #0b1030. -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e3bf"/><stop offset=".3" stop-color="#d4b06a"/>
      <stop offset=".62" stop-color="#3655e0"/><stop offset="1" stop-color="#0b1030"/>
    </linearGradient>
    <radialGradient id="sun" cx=".62" cy=".18" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#f7eed8"/><stop offset="1" stop-color="#dcbf7c"/>
    </linearGradient>
    <filter id="c" x="-30%" y="-40%" width="160%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="5" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="c2" x="-30%" y="-60%" width="160%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="4" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="55" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#s)"/>
  <rect width="800" height="600" fill="url(#sun)"/>
  <g filter="url(#c)">
    <g fill="url(#shade)">
      <ellipse cx="170" cy="250" rx="190" ry="78"/><ellipse cx="330" cy="205" rx="170" ry="92"/>
      <ellipse cx="520" cy="230" rx="210" ry="88"/><ellipse cx="700" cy="265" rx="170" ry="70"/>
      <ellipse cx="410" cy="300" rx="330" ry="62"/>
    </g>
    <g fill="#fff" opacity=".85">
      <ellipse cx="300" cy="175" rx="110" ry="58"/><ellipse cx="560" cy="190" rx="120" ry="52"/><ellipse cx="120" cy="225" rx="90" ry="40"/>
    </g>
  </g>
  <g filter="url(#c2)">
    <g fill="#e9d6a3" opacity=".55"><ellipse cx="90" cy="360" rx="220" ry="46"/><ellipse cx="430" cy="372" rx="260" ry="50"/><ellipse cx="760" cy="352" rx="190" ry="44"/></g>
    <g fill="#b8975a" opacity=".4"><ellipse cx="220" cy="455" rx="300" ry="56"/><ellipse cx="640" cy="470" rx="300" ry="60"/></g>
    <g fill="#2b4f80" opacity=".35"><ellipse cx="400" cy="560" rx="460" ry="70"/></g>
  </g>
</svg>
