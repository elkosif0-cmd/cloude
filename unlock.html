/* KOSIF Luxe sign-in: the sky visual beside a white card (stacked on phones) */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#0b1c33;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 70% 0%,#16406e 0%,#0b1f3a 55%,#061226 100%)}
.shell{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);width:min(980px,100%);min-height:600px;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 40px 100px -30px rgba(0,0,0,.65)}
.visual{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:34px 34px 30px;color:#fff;background:#0b1f3a url(./art/kosif-sky.svg) center/cover no-repeat}
.visual::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,38,.05) 30%,rgba(6,18,38,.82))}
.visual>*{position:relative;z-index:1}
.wm{display:flex;align-items:center;gap:12px;direction:ltr}
.wm img{width:62px;height:42px;filter:drop-shadow(0 4px 12px rgba(6,18,38,.35))}
.wm .wm-logo{width:min(360px,100%);height:auto;padding:14px 18px;border-radius:14px;background:rgba(4,12,28,.72)}
.wm b{display:block;font:800 30px/1 Montserrat,"Segoe UI",sans-serif;letter-spacing:.05em;color:#0b1f3a}
.wm small{display:block;margin-top:4px;font:600 11.5px Montserrat,sans-serif;letter-spacing:.04em;color:#23466f}
.claim h2{margin:0;font-size:34px;line-height:1.3;font-weight:700}
.claim p{margin:8px 0 0;font:600 14px Montserrat,sans-serif;letter-spacing:.03em;color:#cfe0f5}
.claim i{display:block;width:84px;height:4px;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,#22b8e6,#1668e3)}
.card{position:relative;display:flex;flex-direction:column;justify-content:center;padding:44px 40px 32px;text-align:center}
.logo{width:120px;height:44px;object-fit:contain}
.brand-tag{display:block;margin-top:6px;font-size:12.5px;font-weight:600;color:#8292a8}
h1{margin:6px 0 4px;font:800 32px/1.1 Montserrat,"Segoe UI",sans-serif;letter-spacing:.04em;color:#0b1f3a}
.sub{margin:0 0 24px;font-size:14px;line-height:1.8;color:#44566f}
.field{position:relative}
.field input{width:100%;height:54px;padding:0 54px 0 18px;border:1px solid #d3dce8;border-radius:14px;outline:none;background:#f7f9fc;color:#0b1c33;font:inherit;font-size:16.5px;transition:all .2s ease}
[dir="rtl"] .field input{padding:0 18px 0 54px}
.field input:focus{border-color:#1668e3;background:#fff;box-shadow:0 0 0 4px rgba(22,104,227,.14)}
.eye{position:absolute;top:7px;inset-inline-end:8px;display:grid;place-items:center;width:40px;height:40px;border:0;background:transparent;color:#8292a8;cursor:pointer}\n.eye:focus-visible,button.submit:focus-visible{outline:3px solid #1668e3;outline-offset:3px}
.eye svg{width:20px;height:20px}
button.submit{width:100%;height:54px;margin-top:16px;border:0;border-radius:14px;background:linear-gradient(180deg,#2677ee,#1668e3);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 12px 26px -12px rgba(22,104,227,.8);transition:all .2s ease}
button.submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 30px -12px rgba(22,104,227,.9)}
button.submit:disabled{opacity:.65;cursor:default}
.msg{min-height:24px;margin:12px 0 0;font-size:13.5px;font-weight:600;color:#d3322a}
.progress{margin-top:6px;font-size:13px;color:#8292a8}
.badge{display:inline-flex;align-items:center;gap:7px;margin:18px auto 0;padding:8px 14px;border-radius:999px;background:#e8f1fe;color:#1668e3;font-size:12px;font-weight:600}
.badge svg{width:15px;height:15px}
.slogan{margin-top:14px;font-size:12px;color:#8292a8}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@media (max-width:820px){
  body{place-items:start center}
  .shell{grid-template-columns:1fr;min-height:0;border-radius:24px}
  .visual{min-height:210px;padding:22px 22px 20px}
  .claim h2{font-size:24px}
  .card{padding:28px 22px 24px}
}
/* installed laptop window without a title bar: keep a strip to drag the window by */
@media (display-mode: window-controls-overlay){body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(titlebar-area-height,33px);-webkit-app-region:drag;app-region:drag}}

<body>
<div class="shell">
<aside class="visual" aria-hidden="true">
<div class="wm"><img class="wm-logo" src="./art/sqc-logo.svg" alt="SQC — Smart Quality Control"></div>
<div class="claim"><h2>رقابة جودة ذكية،<br>مراجعة بمعايير عالمية</h2><p>AI-Powered Audit &amp; Assurance Platform</p><i></i></div>
</aside>
<main class="card">
<div><img class="logo" src="./art/sqc-mark-dark.svg" alt="SQC"><span class="brand-tag">Smart Quality Control</span></div>
<h1 id="login-title">SQC</h1>
<p class="sub" id="unlock-help">منصة المراجعة والتأكيد المدعومة بالذكاء الاصطناعي، مع أدوات مساعدة للمحاسب. أدخل كلمة المرور المشفرة لفتح التطبيق.</p>
<form id="f" aria-labelledby="login-title">
<label class="sr-only" for="p">كلمة المرور الآمنة</label>
<div class="field"><input id="p" name="password" type="password" autocomplete="current-password" placeholder="كلمة المرور الآمنة" aria-describedby="unlock-help" required autofocus><button class="eye" id="eye" type="button" aria-label="إظهار كلمة المرور" aria-pressed="false" aria-controls="p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<button class="submit" id="go" type="submit">دخول آمن للمنصة</button>
</form>
<div class="msg" id="msg" role="alert" aria-live="assertive" aria-atomic="true"></div><div class="progress" id="progress" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>تشفير متقدم بنظام ChaCha20 و PBKDF2</div><div class="slogan">البيانات تُفك على هذا الجهاز فقط.</div>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const eye=$("eye"),pw=$("p");
eye.onclick=()=>{const reveal=pw.type==="password";pw.type=reveal?"text":"password";eye.setAttribute("aria-pressed",String(reveal));eye.setAttribute("aria-label",reveal?"إخفاء كلمة المرور":"إظهار كلمة المرور")};
function b64(s){const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
function rotl(v,n){return ((v<<n)|(v>>>(32-n)))>>>0}
function r32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
function w32(a,o,v){a[o]=v&255;a[o+1]=v>>>8&255;a[o+2]=v>>>16&255;a[o+3]=v>>>24&255}
function qr(x,a,b,c,d){x[a]=(x[a]+x[b])>>>0;x[d]^=x[a];x[d]=rotl(x[d],16);x[c]=(x[c]+x[d])>>>0;x[b]^=x[c];x[b]=rotl(x[b],12);x[a]=(x[a]+x[b])>>>0;x[d]^=x[a];x[d]=rotl(x[d],8);x[c]=(x[c]+x[d])>>>0;x[b]^=x[c];x[b]=rotl(x[b],7)}
function block(k,c,n){const x=new Uint32Array(16),o=new Uint32Array(16),z=new Uint8Array(64);x[0]=0x61707865;x[1]=0x3320646e;x[2]=0x79622d32;x[3]=0x6b206574;for(let i=0;i<8;i++)x[4+i]=r32(k,i*4);x[12]=c>>>0;x[13]=r32(n,0);x[14]=r32(n,4);x[15]=r32(n,8);o.set(x);for(let i=0;i<10;i++){qr(x,0,4,8,12);qr(x,1,5,9,13);qr(x,2,6,10,14);qr(x,3,7,11,15);qr(x,0,5,10,15);qr(x,1,6,11,12);qr(x,2,7,8,13);qr(x,3,4,9,14)}for(let i=0;i<16;i++)w32(z,i*4,(x[i]+o[i])>>>0);return z}
function xor(d,k,n,c=1){const o=new Uint8Array(d.length);let q=0;while(q<d.length){const s=block(k,c++,n),m=Math.min(64,d.length-q);for(let i=0;i<m;i++)o[q+i]=d[q+i]^s[i];q+=m}return o}
async function loadCipher(meta){const texts=await Promise.all(meta.parts.map((u,i)=>fetch("./"+u,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("part "+i);return r.text()})));const arr=texts.map(t=>b64(t.trim()));let total=0;arr.forEach(a=>total+=a.length);const out=new Uint8Array(total);let off=0;for(const a of arr){out.set(a,off);off+=a.length}return out}
$("f").addEventListener("submit",async e=>{
e.preventDefault();$("msg").textContent="";$("go").disabled=true;$("f").setAttribute("aria-busy","true");$("progress").textContent="جارٍ التحقق وفك التشفير…";const enteredPassword=$("p").value;
try{
const meta=await fetch("./secure/crypto.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("meta");return r.json()});
const pass=new TextEncoder().encode(enteredPassword);
const base=await crypto.subtle.importKey("raw",pass,"PBKDF2",false,["deriveBits"]);
const [bits,ct]=await Promise.all([
  crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(meta.salt_b64),iterations:meta.iterations},base,512),
  loadCipher(meta)
]);
const dk=new Uint8Array(bits),ek=dk.slice(0,32),mk=dk.slice(32),nonce=b64(meta.nonce_b64);
$("progress").textContent="جارٍ التحقق من سلامة البيانات…";
const macKey=await crypto.subtle.importKey("raw",mk,{name:"HMAC",hash:"SHA-256"},false,["verify"]);
const signed=new Uint8Array(nonce.length+ct.length);signed.set(nonce);signed.set(ct,nonce.length);
const ok=await crypto.subtle.verify("HMAC",macKey,b64(meta.tag_b64),signed);
if(!ok)throw new Error("bad-password");
$("progress").textContent="جارٍ فتح قاعدة البيانات…";
const seed=new TextDecoder().decode(xor(ct,ek,nonce,1));
if(seed.length<1000000||!/^[A-Za-z0-9+/=]+$/.test(seed))throw new Error("bad-data");
let app=await fetch("./app-safe.html",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("app");return r.text()});
const marker='const SEED_B64 = "";';
if(!app.includes(marker))throw new Error("app-marker");
app=app.replace(marker,'const SEED_B64 = "'+seed+'";');
const pr=await fetch("./secure/private.json",{cache:"no-store"});
if(pr.ok){
  const pm=await pr.json(),pn=b64(pm.nonce_b64),pct=await loadCipher(pm);
  const psigned=new Uint8Array(pn.length+pct.length);psigned.set(pn);psigned.set(pct,pn.length);
  if(!await crypto.subtle.verify("HMAC",macKey,b64(pm.tag_b64),psigned))throw new Error("bad-private");
  const pz=new Blob([xor(pct,ek,pn,1)]).stream().pipeThrough(new DecompressionStream("gzip"));
  const blocks=JSON.parse(await new Response(pz).text());
  for(const [ph,orig] of Object.entries(blocks)){if(!app.includes(ph))throw new Error("private-marker");app=app.replace(ph,()=>orig);}
}
$("progress").textContent="جارٍ تفعيل Jev…";
try{
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);
  const sr=await fetch("https://aghnam-jev-api.kosif199022.workers.dev/session",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:enteredPassword}),signal:ctl.signal});
  clearTimeout(tm);
  const sd=await sr.json();
  if(sr.ok&&sd.ok&&sd.token)sessionStorage.setItem("aghnamJevSession",sd.token);else sessionStorage.removeItem("aghnamJevSession");
}catch(_){sessionStorage.removeItem("aghnamJevSession")}
$("p").value="";
document.open();document.write(app);document.close();
}catch(err){console.error(err);$("msg").textContent="كلمة المرور غير صحيحة أو تعذر فتح البيانات.";$("progress").textContent="";$("p").select()}
finally{const g=$("go");if(g)g.disabled=false;const f=$("f");if(f)f.setAttribute("aria-busy","false")}
});
</script>
</body></html>
