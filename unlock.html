<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>S.kosif — دخول آمن</title>
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Outfit:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Outfit',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Naskh Arabic",sans-serif;background:#FAF8F5;color:#1E201D;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#F4EFE6 0%,#FAF8F5 60%,#ECE5D8 100%)}
.card{width:min(460px,100%);background:#FFFFFF;border:1px solid #E8E3D8;border-radius:28px;padding:36px 28px;box-shadow:0 24px 70px rgba(30,32,29,.09);text-align:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#A82A2A,#C28B28,#244C37)}
.logo-wrap{position:relative;display:inline-block;margin-bottom:6px}
.logo{width:88px;height:88px;border-radius:24px;object-fit:cover;box-shadow:0 12px 32px rgba(36,76,55,.18);border:2px solid #FAF8F5}
.brand-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#82877E;margin-top:10px}
h1{font-family:'Amiri',"Noto Naskh Arabic",serif;font-size:32px;margin:4px 0 6px;color:#1E201D;letter-spacing:-0.01em}
.sub{font-size:14px;color:#5E645A;line-height:1.75;margin:0 0 24px}
.field{position:relative}
.field input{width:100%;height:54px;border:1px solid #E0DAD0;border-radius:16px;padding:0 18px 0 54px;font-size:16.5px;outline:none;background:#FAF8F5;color:#1E201D;transition:all .2s ease}
[dir="rtl"] .field input{padding:0 54px 0 18px}
.field input:focus{border-color:#244C37;background:#FFFFFF;box-shadow:0 0 0 4px rgba(36,76,55,.12)}
.eye{position:absolute;inset-inline-end:10px;top:7px;width:40px;height:40px;border:0;background:transparent;font-size:18px;color:#767B73;cursor:pointer;display:grid;place-items:center}
button.submit{width:100%;height:52px;border:0;border-radius:16px;margin-top:16px;background:#244C37;color:#FFFFFF;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(36,76,55,.24);transition:all .2s ease}
button.submit:hover:not(:disabled){background:#1B3B2B;transform:translateY(-1px);box-shadow:0 8px 24px rgba(36,76,55,.32)}
button.submit:disabled{opacity:.65;cursor:default}
.msg{min-height:24px;margin:12px 0 0;font-size:13.5px;color:#A82A2A;font-weight:600}
.progress{font-size:13px;color:#767B73;margin-top:8px}
.badge{display:inline-flex;gap:7px;align-items:center;margin-top:20px;padding:8px 14px;border-radius:999px;background:#EBF4EF;color:#244C37;font-size:12px;font-weight:600}
</style>
</head>
<body>
<main class="card">
<div class="logo-wrap"><img class="logo" src="./apple-touch-icon.png" alt="S.kosif"><br><span class="brand-tag">Gourmet Fusion OS</span></div>
<h1>S.kosif</h1>
<p class="sub">منصة العمليات والتسعير والمختارات الفاخرة. أدخل كلمة المرور المشفرة لفتح التطبيق.</p>
<form id="f">
<div class="field"><input id="p" type="password" autocomplete="current-password" placeholder="كلمة المرور الآمنة" required autofocus><button class="eye" id="eye" type="button" aria-label="إظهار كلمة المرور">◉</button></div>
<button class="submit" id="go" type="submit">دخول آمن للمنصة</button>
</form>
<div class="msg" id="msg"></div><div class="progress" id="progress"></div>
<div class="badge">🔐 تشفير متقدم بنظام ChaCha20 و PBKDF2</div>
</main>
<script>
const $=id=>document.getElementById(id);
$("eye").onclick=()=>{$("p").type=$("p").type==="password"?"text":"password"};
function b64(s){const x=atob(s),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
function rotl(v,n){return ((v<<n)|(v>>>(32-n)))>>>0}
function r32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
function w32(a,o,v){a[o]=v&255;a[o+1]=v>>>8&255;a[o+2]=v>>>16&255;a[o+3]=v>>>24&255}
function qr(x,a,b,c,d){x[a]=(x[a]+x[b])>>>0;x[d]^=x[a];x[d]=rotl(x[d],16);x[c]=(x[c]+x[d])>>>0;x[b]^=x[c];x[b]=rotl(x[b],12);x[a]=(x[a]+x[b])>>>0;x[d]^=x[a];x[d]=rotl(x[d],8);x[c]=(x[c]+x[d])>>>0;x[b]^=x[c];x[b]=rotl(x[b],7)}
function block(k,c,n){const x=new Uint32Array(16),o=new Uint32Array(16),z=new Uint8Array(64);x[0]=0x61707865;x[1]=0x3320646e;x[2]=0x79622d32;x[3]=0x6b206574;for(let i=0;i<8;i++)x[4+i]=r32(k,i*4);x[12]=c>>>0;x[13]=r32(n,0);x[14]=r32(n,4);x[15]=r32(n,8);o.set(x);for(let i=0;i<10;i++){qr(x,0,4,8,12);qr(x,1,5,9,13);qr(x,2,6,10,14);qr(x,3,7,11,15);qr(x,0,5,10,15);qr(x,1,6,11,12);qr(x,2,7,8,13);qr(x,3,4,9,14)}for(let i=0;i<16;i++)w32(z,i*4,(x[i]+o[i])>>>0);return z}
function xor(d,k,n,c=1){const o=new Uint8Array(d.length);let q=0;while(q<d.length){const s=block(k,c++,n),m=Math.min(64,d.length-q);for(let i=0;i<m;i++)o[q+i]=d[q+i]^s[i];q+=m}return o}
async function loadCipher(meta){const texts=await Promise.all(meta.parts.map((u,i)=>fetch("./"+u,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("part "+i);return r.text()})));const arr=texts.map(t=>b64(t.trim()));let total=0;arr.forEach(a=>total+=a.length);const out=new Uint8Array(total);let off=0;for(const a of arr){out.set(a,off);off+=a.length}return out}
$("f").addEventListener("submit",async e=>{
e.preventDefault();$("msg").textContent="";$("go").disabled=true;$("progress").textContent="جارٍ التحقق وفك التشفير…";const enteredPassword=$("p").value;
try{
const meta=await fetch("./secure/crypto.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("meta");return r.json()});
const pass=new TextEncoder().encode($("p").value);
const base=await crypto.subtle.importKey("raw",pass,"PBKDF2",false,["deriveBits"]);
const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(meta.salt_b64),iterations:meta.iterations},base,512);
const dk=new Uint8Array(bits),ek=dk.slice(0,32),mk=dk.slice(32),nonce=b64(meta.nonce_b64),ct=await loadCipher(meta);
$("progress").textContent="جارٍ التحقق من سلامة البيانات…";
const macKey=await crypto.subtle.importKey("raw",mk,{name:"HMAC",hash:"SHA-256"},false,["verify"]);
const signed=new Uint8Array(nonce.length+ct.length);signed.set(nonce);signed.set(ct,nonce.length);
const ok=await crypto.subtle.verify("HMAC",macKey,b64(meta.tag_b64),signed);
if(!ok)throw new Error("bad-password");
$("progress").textContent="جارٍ فتح قاعدة البيانات…";
const seed=new TextDecoder().decode(xor(ct,ek,nonce,1));
if(seed.length<1000000||!/^[A-Za-z0-9+/=]+$/.test(seed))throw new Error("bad-data");
let app=await fetch("./app-safe.html",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("app");return r.text()});
const marker='const SEED_B64 = "";';
if(!app.includes(marker))throw new Error("app-marker");
app=app.replace(marker,'const SEED_B64 = "'+seed+'";');
const pr=await fetch("./secure/private.json",{cache:"no-store"});
if(pr.ok){
  const pm=await pr.json(),pn=b64(pm.nonce_b64),pct=await loadCipher(pm);
  const psigned=new Uint8Array(pn.length+pct.length);psigned.set(pn);psigned.set(pct,pn.length);
  if(!await crypto.subtle.verify("HMAC",macKey,b64(pm.tag_b64),psigned))throw new Error("bad-private");
  const pz=new Blob([xor(pct,ek,pn,1)]).stream().pipeThrough(new DecompressionStream("gzip"));
  const blocks=JSON.parse(await new Response(pz).text());
  for(const [ph,orig] of Object.entries(blocks)){if(!app.includes(ph))throw new Error("private-marker");app=app.replace(ph,()=>orig);}
}
$("progress").textContent="جارٍ تفعيل Jev…";
try{
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);
  const sr=await fetch("https://aghnam-jev-api.kosif199022.workers.dev/session",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:enteredPassword}),signal:ctl.signal});
  clearTimeout(tm);
  const sd=await sr.json();
  if(sr.ok&&sd.ok&&sd.token)sessionStorage.setItem("aghnamJevSession",sd.token);else sessionStorage.removeItem("aghnamJevSession");
}catch(_){sessionStorage.removeItem("aghnamJevSession")}
$("p").value="";
document.open();document.write(app);document.close();
}catch(err){console.error(err);$("msg").textContent="كلمة المرور غير صحيحة أو تعذر فتح البيانات.";$("progress").textContent="";$("p").select()}
finally{const g=$("go");if(g)g.disabled=false}
});
</script>
</body></html>
