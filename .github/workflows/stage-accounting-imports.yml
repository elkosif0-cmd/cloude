name: Stage public accounting repos for review

on:
  push:
    branches:
      - consolidate/accounting-repositories-20261011
    paths:
      - .github/workflows/stage-accounting-imports.yml

permissions:
  contents: write

concurrency:
  group: accounting-imports-20261011
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'elkosif0-cmd/cloude'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: consolidate/accounting-repositories-20261011
          fetch-depth: 1
          persist-credentials: true
      - name: Import pinned public source snapshots with safety exclusions
        run: python3 tools/consolidate_accounting_repos.py
