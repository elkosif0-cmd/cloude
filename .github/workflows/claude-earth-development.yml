# Claude Code development for the source behind https://earth.kosif.pp.ua/
# Owner-only comments containing @claude start a paid API run; no scheduled runs or automatic merges.
# Setup: install https://github.com/apps/claude on this repository, then configure
# either ANTHROPIC_API_KEY or the existing finance-smoke secret MOON in GitHub Actions.
# Run the no-cost connection probe before enabling paid generation.
name: Claude API — KOSIF EARTH development

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # Public repo: only the two explicitly named owner accounts can spend API credits.
    if: >-
      github.repository == 'elkosif0-cmd/cloude' &&
      (github.actor == 'elkosif0-cmd' || github.actor == 'kosif199022-jpg') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: claude-earth-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out KOSIF EARTH source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Claude Code — propose reviewed development changes
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY || secrets.MOON }}
          trigger_phrase: '@claude'
          base_branch: main
          claude_args: |
            --max-turns 12
          show_full_output: 'false'
