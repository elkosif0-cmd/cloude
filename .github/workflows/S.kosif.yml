name: S.kosif

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s-kosif-main
  cancel-in-progress: true

jobs:
  validate:
    name: S.kosif Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S.kosif
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source syntax
        run: |
          python3 -m py_compile build.py
          node --check mobile.js
          node --check jev.js
          node --check jev-question.js
          node --check inventory.js
          node --check operations.js
          node --check supply.js
          node --check ux.js
          node --check catalog.js
          node --check shell.js
          node --check sales-matching.js
          node --check pricing-core.js
          node --check pricing.js
          node --check session-health.js
          node --check meat-economics.js
          node --check motion.js

      - name: Test strict pricing kernel
        working-directory: app
        run: |
          npm ci
          npx tsc -p tsconfig.pricing-core.json --noEmit
          npx vitest run src/engine/corePricing/pricing.test.ts

      - name: Test meat economics engine
        working-directory: app
        run: |
          npx tsc -p tsconfig.meatops.json --noEmit
          npx vitest run src/engine/meatOps/ops.test.ts

      - name: Build S.kosif
        env:
          KOSIF_UNLOCK_PASSWORD: ${{ secrets.KOSIF_UNLOCK_PASSWORD }}
        run: python3 build.py

      - name: Validate production bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path("dist/app-safe.html").read_text(encoding="utf-8")
          unlock=Path("dist/index.html").read_text(encoding="utf-8")
          manifest=Path("dist/manifest.webmanifest").read_text(encoding="utf-8")
          required=[
            "operations.css",
            "operations.js",
            "ux.css",
            "ux.js",
            "sales-matching.css",
            "sales-matching.js",
            "pricing.css",
            "pricing-core.js",
            "pricing.js",
            "session-health.css",
            "session-health.js",
            "meat-economics.css",
            "meat-economics.js",
            "motion.css",
            "motion.js",
            "jev.js",
            "jev-question.js",
            "inventory.js"
          ]
          for marker in required:
              assert marker in app, marker
          for f in [
            "operations.css","operations.js","ux.css","ux.js","sales-matching.css","sales-matching.js","pricing.css","pricing-core.js","pricing.js","session-health.css","session-health.js","meat-economics.css","meat-economics.js","motion.css","motion.js","jev.js","jev-question.js",
            "inventory.js","sw.js","manifest.webmanifest","secure/crypto.json"
          ]:
              assert Path("dist",f).exists(), f
          assert "<title>S.kosif</title>" in app
          assert "S.kosif" in unlock
          assert '"name":"S.kosif"' in manifest
          assert "const SEED_B64 = \"\";" in app
          assert len(list(Path("dist/secure").glob("seed.enc.b64.part*"))) == 6
          assert Path("dist/secure/private.json").exists(), "private data not encrypted"
          assert "SEED_RAWS=[{" not in app, "price catalog left in plaintext"
          assert '{"__aghnam_private":"modules"}' in app, "v25 modules left in plaintext"
          js=Path("dist/operations.js").read_text(encoding="utf-8")
          for marker in [
            "Operations & Decision OS",
            "التسعير السريع",
            "Customer 360",
            "حوكمة واعتماد الأسعار",
            "صحة البيانات والتخزين"
          ]:
              assert marker in js, marker
          sx=Path("dist/ux.js").read_text(encoding="utf-8")
          for marker in ["Command palette","Zero-PII","SKosifSafeCSV","beforeinstallprompt"]:
              assert marker in sx, marker
          jz=Path("dist/sales-matching.js").read_text(encoding="utf-8")
          for marker in ["normalizeArabic","similarity","product_aliases","Pareto ABC","SKIP_WAITING"]:
              assert marker in jz, marker
          sw=Path("dist/sw.js").read_text(encoding="utf-8")
          assert "SKIP_WAITING" in sw
          core=Path("dist/pricing-core.js").read_text(encoding="utf-8")
          for marker in ["calculateUsableUnitCost","applyRoundingPolicy","calculateBoxPricing","hasCircularDependency","nrvAllocate","yieldTrial","selfTest"]:
              assert marker in core, marker
          ui=Path("dist/pricing.js").read_text(encoding="utf-8")
          for marker in ["محرك التسعير الدقيق","Strict Pricing Kernel","AskJev"]:
              assert marker in ui, marker
          sess=Path("dist/session-health.js").read_text(encoding="utf-8")
          for marker in ["hasStorageAccess","requestStorageAccess","indexedDB","aghnamJevSession","serviceWorker","SKosifSessionHealthV36"]:
              assert marker in sess, marker
          meat=Path("dist/meat-economics.js").read_text(encoding="utf-8")
          for marker in ["اقتصاديات الذبيحة","dressing","allocate","aging","أعمار الذمم"]:
              assert marker in meat, marker
          motion=Path("dist/motion.js").read_text(encoding="utf-8")
          for marker in ["requestAnimationFrame","prefers-reduced-motion","constellation","vortex","celebration","SKosifMotionV38"]:
              assert marker in motion, marker
          shell=Path("dist/shell.js").read_text(encoding="utf-8")
          for marker in ["العمل اليومي","أدوات متقدمة","executive-light","executive-dark","gourmet","contrast"]:
              assert marker in shell, marker
          sources={
              "main":Path("dist/operations.js").read_text(encoding="utf-8"),
              "jev":Path("dist/jev.js").read_text(encoding="utf-8"),
              "inventory":Path("dist/inventory.js").read_text(encoding="utf-8"),
              "windows":Path("dist/ux.js").read_text(encoding="utf-8"),
              "session":Path("dist/session-health.js").read_text(encoding="utf-8"),
              "motion":Path("dist/motion.js").read_text(encoding="utf-8"),
          }
          forbidden_by_source={
              "main":["id=\"sk-fab\""],
              "jev":["id=\"jev-fab\""],
              "inventory":["id=\"v29-fab\"","data-v29-tab=\"pricing\""],
              "windows":["id=\"sx-taskbar\"","data-sx-min"],
              "session":["id=\"sk36-health\""],
              "motion":["id=\"sk38-motion-btn\""],
          }
          for name,markers in forbidden_by_source.items():
              for marker in markers:
                  assert marker not in sources[name], f"{name}: {marker}"
          assert "sk33-yieldw" not in shell, "duplicate yield simulator remains"
          assert "محرك V35" not in ui
          assert "مركز V29" not in sources["inventory"]
          print("S.kosif canonical validation: OK")
          PY
