name: S.kosif Zero-Legacy Rebuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: s-kosif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Zero-Legacy Production Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S.kosif
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate platform source syntax
        run: |
          python3 -m py_compile build.py private_blocks.py tools/payload.py
          node --check sw.js
          node --check capabilities-v2/worker.js
          node --check jev-api/worker.js

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Test deterministic pricing kernel
        working-directory: app
        run: |
          npx tsc -p tsconfig.pricing-core.json --noEmit
          npx vitest run src/engine/corePricing/pricing.test.ts

      - name: Test meat economics engine
        working-directory: app
        run: |
          npx tsc -p tsconfig.meatops.json --noEmit
          npx vitest run src/engine/meatOps/ops.test.ts

      - name: Typecheck reconstructed application
        working-directory: app
        run: npx tsc -p tsconfig.rebuild.json --noEmit

      - name: Enforce reconstructed source boundaries
        working-directory: app
        run: |
          if grep -R -n -E '(alert|prompt|confirm)\(' src/rebuild --include='*.ts' --include='*.tsx'; then
            echo "Blocking browser dialog found in reconstructed source"; exit 1
          fi
          if grep -R -n -E 'ينتظر نقل القدرة|Zero Legacy Gate غير مفتوح' src/rebuild --include='*.ts' --include='*.tsx'; then
            echo "Unported capability marker found in reconstructed source"; exit 1
          fi
          if grep -R -n -E "from[[:space:]]*['\"][.]{1,2}/.*ui/" src/rebuild --include='*.ts' --include='*.tsx'; then
            echo "Legacy UI import found in reconstructed source"; exit 1
          fi

      - name: Test reconstructed application contracts
        working-directory: app
        run: npx vitest run src/rebuild/core/capabilities.test.ts src/rebuild/services/specialist.test.ts src/rebuild/services/operations.test.ts src/rebuild/services/audit.test.ts src/rebuild/services/auditAdvanced.test.ts

      - name: Build reconstructed application
        working-directory: app
        run: npm run build

      - name: Assemble encrypted production
        env:
          KOSIF_UNLOCK_PASSWORD: ${{ secrets.KOSIF_UNLOCK_PASSWORD }}
        run: python3 build.py

      - name: Validate zero-legacy production bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path("dist/app-safe.html").read_text(encoding="utf-8")
          unlock=Path("dist/index.html").read_text(encoding="utf-8")
          manifest=Path("dist/manifest.webmanifest").read_text(encoding="utf-8")
          sw=Path("dist/sw.js").read_text(encoding="utf-8")
          assets=list(Path("dist/assets").glob("*"))

          for f in ["app-safe.html","index.html","sw.js","manifest.webmanifest","secure/crypto.json","secure/private.json"]:
              assert Path("dist",f).exists(), f
          assert assets, "Vite assets missing"
          assert any(p.suffix==".js" for p in assets), "Vite JS missing"
          assert any(p.suffix==".css" for p in assets), "Vite CSS missing"

          assert "S.kosif" in unlock
          assert '"name":"S.kosif"' in manifest
          assert 'const SEED_B64 = "";' in app
          assert "window.__SKOSIF_BOOTSTRAP__" in app
          assert '{"__aghnam_private":"modules"}' in app
          assert len(list(Path("dist/secure").glob("seed.enc.b64.part*"))) == 6
          assert "SEED_RAWS=[{" not in app, "private catalog left in plaintext"

          # Presentation must come only from the reconstructed Vite app.
          forbidden=[
              "skosif.js","skosif.css","SKosifCore.registerView","Product360Modal",
              "sk-fab","jev-fab","v29-fab","sx-taskbar","sk33-dock","v21-dock",
              "v26-tabbar","v203-magic-fab","v204-contract-fab"
          ]
          for marker in forbidden:
              assert marker not in app, "legacy presentation leaked: "+marker

          bundle="\n".join(p.read_text(encoding="utf-8",errors="ignore") for p in assets if p.suffix==".js")
          for marker in [
              "مركز القيادة","المبيعات والعملاء","المخزون والإنتاج","المركز المالي",
              "الكتالوج والتسعير","مركز Jev الذكي","المحاسبة والمراجعة","النظام والتكاملات",
              "أوامر الشراء","كفاءة القصاب","اشتراكات اللحوم","ماسح الباركود","دليل الشيف","اقتصاديات الذبيحة",
              "الأهمية النسبية","اختبارات القيود","Benford","مجلس المراجعين","مختبر المعايير",
              "طلبات الأدلة","Document Intelligence Gateway","الإكمال والتقرير","طباعة / PDF"
          ]:
              assert marker in bundle, marker
          assert "SKIP_WAITING" in sw
          assert "skosif.js" not in sw and "skosif.css" not in sw

          # Server governance remains available independently of presentation.
          cap_worker=Path("capabilities-v2/worker.js").read_text(encoding="utf-8")
          cap_schema=Path("capabilities-v2/schema.sql").read_text(encoding="utf-8")
          for marker in ["ROLE_PERMISSIONS","authorizeRole","normalizeWorkspaceState","verifyCloudflareAccessSubject","workspace_revision_conflict","integrityStatus"]:
              assert marker in cap_worker, marker
          for marker in ["tenants","tenant_members","workspaces","workspace_revisions","audit_log","archived_workspace_is_read_only"]:
              assert marker in cap_schema, marker

          print("Zero-legacy production validation: OK")
          PY

      - name: Verify Cloudflare deployment credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Deploy verified build to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=s-kosif --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
