name: S.kosif Grand Fusion Clean-Slate

on:
  push:
    branches:
      - rebuild/grand-fusion-clean-slate-20260925
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify clean-slate legacy guard
        run: node --test scripts/check-no-legacy.test.mjs

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install clean app dependencies
        working-directory: app
        run: npm install

      - name: Run AppRoot RED/GREEN test
        working-directory: app
        run: npm test -- AppRoot.test.tsx
