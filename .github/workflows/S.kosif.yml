name: S.kosif

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s-kosif-main
  cancel-in-progress: true

jobs:
  validate:
    name: S.kosif Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S.kosif
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source syntax
        run: |
          python3 -m py_compile build.py
          node --check skosif-v30.js
          node --check skosif-supply-v31.js
          node --check skosif-sinam-v32.js
          node --check skosif-catalog-v32.js
          node --check skosif-shell-v33.js
          node --check skosif-jazarti-v34.js
          node --check skosif-pricing-core-v35.js
          node --check skosif-pricing-v35.js
          node --check skosif-session-v36.js
          node --check skosif-meatops-v37.js
          node --check skosif-motion-v38.js
          node --check jev-v1.js
          node --check jev-question-v1.js
          node --check v29-smart.js

      - name: Test strict pricing kernel
        working-directory: app
        run: |
          npm ci
          npx tsc -p tsconfig.pricing-core.json --noEmit
          npx vitest run src/engine/corePricing/pricing.test.ts

      - name: Test meat economics engine
        working-directory: app
        run: |
          npx tsc -p tsconfig.meatops.json --noEmit
          npx vitest run src/engine/meatOps/ops.test.ts

      - name: Build S.kosif
        env:
          KOSIF_UNLOCK_PASSWORD: ${{ secrets.KOSIF_UNLOCK_PASSWORD }}
        run: python3 build.py

      - name: Validate production bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path("dist/app-safe.html").read_text(encoding="utf-8")
          unlock=Path("dist/index.html").read_text(encoding="utf-8")
          manifest=Path("dist/manifest.webmanifest").read_text(encoding="utf-8")
          required=[
            "skosif-v30.css?v=30",
            "skosif-v30.js?v=30",
            "skosif-sinam-v32.css?v=32",
            "skosif-sinam-v32.js?v=32",
            "skosif-jazarti-v34.css?v=34",
            "skosif-jazarti-v34.js?v=34",
            "skosif-pricing-v35.css?v=35",
            "skosif-pricing-core-v35.js?v=35",
            "skosif-pricing-v35.js?v=35",
            "skosif-session-v36.css?v=36",
            "skosif-session-v36.js?v=36",
            "skosif-meatops-v37.css?v=37",
            "skosif-meatops-v37.js?v=37",
            "skosif-motion-v38.css?v=38",
            "skosif-motion-v38.js?v=38",
            "jev-v1.js?v=1",
            "jev-question-v1.js?v=1",
            "v29-smart.js?v=29"
          ]
          for marker in required:
              assert marker in app, marker
          for f in [
            "skosif-v30.css","skosif-v30.js","skosif-sinam-v32.css","skosif-sinam-v32.js","skosif-jazarti-v34.css","skosif-jazarti-v34.js","skosif-pricing-v35.css","skosif-pricing-core-v35.js","skosif-pricing-v35.js","skosif-session-v36.css","skosif-session-v36.js","skosif-meatops-v37.css","skosif-meatops-v37.js","skosif-motion-v38.css","skosif-motion-v38.js","jev-v1.js","jev-question-v1.js",
            "v29-smart.js","sw.js","manifest.webmanifest","secure/crypto.json"
          ]:
              assert Path("dist",f).exists(), f
          assert "<title>S.kosif</title>" in app
          assert "S.kosif" in unlock
          assert '"name":"S.kosif"' in manifest
          assert "const SEED_B64 = \"\";" in app
          assert len(list(Path("dist/secure").glob("seed.enc.b64.part*"))) == 6
          assert Path("dist/secure/private.json").exists(), "private data not encrypted"
          assert "SEED_RAWS=[{" not in app, "price catalog left in plaintext"
          assert '{"__aghnam_private":"modules"}' in app, "v25 modules left in plaintext"
          js=Path("dist/skosif-v30.js").read_text(encoding="utf-8")
          for marker in [
            "Fusion Operations & Decision OS",
            "محرك التسعير V30",
            "Customer 360",
            "حوكمة واعتماد الأسعار",
            "صحة البيانات والتخزين"
          ]:
              assert marker in js, marker
          sx=Path("dist/skosif-sinam-v32.js").read_text(encoding="utf-8")
          for marker in ["Command palette","Zero-PII","SKosifSafeCSV","beforeinstallprompt"]:
              assert marker in sx, marker
          jz=Path("dist/skosif-jazarti-v34.js").read_text(encoding="utf-8")
          for marker in ["normalizeArabic","similarity","product_aliases","Pareto ABC","SKIP_WAITING"]:
              assert marker in jz, marker
          sw=Path("dist/sw.js").read_text(encoding="utf-8")
          assert "SKIP_WAITING" in sw
          core=Path("dist/skosif-pricing-core-v35.js").read_text(encoding="utf-8")
          for marker in ["calculateUsableUnitCost","applyRoundingPolicy","calculateBoxPricing","hasCircularDependency","nrvAllocate","yieldTrial","selfTest"]:
              assert marker in core, marker
          ui=Path("dist/skosif-pricing-v35.js").read_text(encoding="utf-8")
          for marker in ["محرك V35","Strict Pricing Kernel","AskJev"]:
              assert marker in ui, marker
          sess=Path("dist/skosif-session-v36.js").read_text(encoding="utf-8")
          for marker in ["hasStorageAccess","requestStorageAccess","indexedDB","aghnamJevSession","serviceWorker","SKosifSessionHealthV36"]:
              assert marker in sess, marker
          meat=Path("dist/skosif-meatops-v37.js").read_text(encoding="utf-8")
          for marker in ["اقتصاديات الذبيحة","dressing","allocate","aging","أعمار الذمم"]:
              assert marker in meat, marker
          motion=Path("dist/skosif-motion-v38.js").read_text(encoding="utf-8")
          for marker in ["requestAnimationFrame","prefers-reduced-motion","constellation","vortex","celebration","SKosifMotionV38"]:
              assert marker in motion, marker
          print("S.kosif V38 validation: OK")
          PY
