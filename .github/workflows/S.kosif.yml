name: S.kosif

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s-kosif-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-smoke:
    name: Windows production-build smoke
    runs-on: windows-latest
    env:
      KOSIF_UNLOCK_PASSWORD: ${{ secrets.KOSIF_UNLOCK_PASSWORD }}
    steps:
      - name: Checkout S.kosif
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build S.kosif on Windows
        run: python build.py

      - name: Verify Windows build artifacts
        run: python -c "from pathlib import Path; required=['dist/index.html','dist/app-safe.html','dist/skosif.js','dist/skosif.css','dist/sw.js']; missing=[p for p in required if not Path(p).is_file()]; assert not missing, 'missing build artifacts: '+', '.join(missing); print('Windows production-build smoke: OK')"

  validate:
    name: S.kosif Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S.kosif
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate source syntax
        run: |
          python3 -m py_compile build.py private_blocks.py tools/payload.py
          for f in ui/core/*.js ui/components/*.js ui/layouts/*.js ui/features/*.js; do node --check "$f"; done
          node --check sw.js
          node --check capabilities-v2/worker.js

      - name: Lint UI modules (out-of-scope names, duplicate keys, unreachable code)
        run: |
          npm install --no-save --no-package-lock eslint@9 globals@15
          npx eslint ui/core ui/components ui/layouts ui/features

      - name: Test strict pricing kernel
        working-directory: app
        run: |
          npm ci
          npx tsc -p tsconfig.pricing-core.json --noEmit
          npx vitest run src/engine/corePricing/pricing.test.ts

      - name: Test meat economics engine
        working-directory: app
        run: |
          npx tsc -p tsconfig.meatops.json --noEmit
          npx vitest run src/engine/meatOps/ops.test.ts

      - name: Test fusion engines (finance, procurement, sales, stock, audit, intelligence)
        working-directory: app
        run: |
          npx tsc -p tsconfig.fusion.json --noEmit
          npx vitest run src/engine/fusion
          node ../tools/build_engines.mjs --check

      - name: Test KOSIF Think orchestrator
        working-directory: app
        run: |
          npx tsc -p tsconfig.think.json --noEmit
          npx vitest run src/engine/think

      - name: Capability docs are in sync with the registry
        run: python3 tools/capability_docs.py --check

      - name: Build S.kosif
        env:
          KOSIF_UNLOCK_PASSWORD: ${{ secrets.KOSIF_UNLOCK_PASSWORD }}
        run: python3 build.py

      - name: Validate production bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path("dist/app-safe.html").read_text(encoding="utf-8")
          unlock=Path("dist/index.html").read_text(encoding="utf-8")
          manifest=Path("dist/manifest.webmanifest").read_text(encoding="utf-8")
          js=Path("dist/skosif.js").read_text(encoding="utf-8")
          css=Path("dist/skosif.css").read_text(encoding="utf-8")
          sw=Path("dist/sw.js").read_text(encoding="utf-8")
          for f in ["skosif.js","skosif.css","sw.js","manifest.webmanifest","secure/crypto.json","secure/private.json"]:
              assert Path("dist",f).exists(), f
          assert "./skosif.css?v=" in app and "./skosif.js?v=" in app, "ui bundle not linked"
          assert "<title>SQC — Smart Quality Control</title>" in app
          assert "SQC" in unlock and "sqc-logo.svg" in unlock
          assert '"name":"SQC — Smart Quality Control"' in manifest
          assert "const SEED_B64 = \"\";" in app
          assert len(list(Path("dist/secure").glob("seed.enc.b64.part*"))) == 6
          assert "SEED_RAWS=[{" not in app, "price catalog left in plaintext"
          # one navigation, no floating layers
          for gone in ["sk-fab","jev-fab","v29-fab","sx-taskbar","sk33-dock","v21-dock","v26-tabbar","v203-magic-fab","v204-contract-fab","V25_MODULES_BEGIN"]:
              assert gone not in app and gone not in js, "old floating layer is back: "+gone
          for marker in ["registerView","SKosifCore","sk:render","SKosifShell"]:
              assert marker in app, marker
          # zero-legacy shell: none of the old stacked layers may come back
          for gone in ["v21-organizer","v21-radiant","v21-ux-script","v21-pal-wrap","v21-splash","v21-tour-card","V23_SHELL","v23-topsearch","v24-pagehead","v24-icons",
                       "V26_IOS","v27-laptop","v271-ios","v272-ios","v28-ios","v29-ios","v30-ios","jev-green-hybrid","v22-azea","sk-theme-css","data-sk-theme","V21RAD","V21UX","SKosifNav"]:
              assert gone not in app and gone not in js and gone not in css, "legacy layer is back: "+gone
          assert app.count("<style")<=4, "inline stylesheets belong in ui/ds"
          # every capability in the registry is a real screen
          import json,re
          caps=json.load(open("ui/core/capabilities.json",encoding="utf-8"))["capabilities"]
          core_views=set(re.findall(r"\n  (\w+): \{ render:",app))|set(re.findall(r"VIEWS\.(\w+)\s*=",app))
          for c in caps:
              assert f'view("{c["id"]}"' in js or c["id"] in core_views or f'"{c["id"]}","' in js, "capability without a screen: "+c["id"]
          # every screen is registered in the one bundle
          for view in ["offers","inventory","suppliers","cash","receivables","jev","sensitivity","kernel","carcass","smartmatch","excelrecon",
                       "zatca","blending","labels","traceability","culinary","scanner","b2bcredit","execreports","operations"]:
              assert f'view("{view}"' in js, "screen missing: "+view
          for marker in ["calculateUsableUnitCost","applyRoundingPolicy","calculateBoxPricing","hasCircularDependency","nrvAllocate","yieldTrial","selfTest",
                         "normalizeArabic","similarity","redact","SKIP_WAITING","zatcaTLV","code128SVG","SKosifEnterpriseV38","SKosifReports","SKosifERPPlus","SKosifOperations","SKosifCapabilitiesV2"]:
              assert marker in js, marker
          assert 'SK.view("capabilitiesv2"' in js, "Capabilities v2 screen missing"
          cap_worker=Path("capabilities-v2/worker.js").read_text(encoding="utf-8")
          cap_schema=Path("capabilities-v2/schema.sql").read_text(encoding="utf-8")
          for marker in ["ROLE_PERMISSIONS","authorizeRole","normalizeWorkspaceState","verifyCloudflareAccessSubject","workspace_revision_conflict","integrityStatus"]:
              assert marker in cap_worker, marker
          for marker in ["CREATE TABLE IF NOT EXISTS tenants","tenant_members","workspaces","workspace_revisions","audit_log","archived_workspace_is_read_only"]:
              assert marker in cap_schema, marker
          assert "SKIP_WAITING" in sw and "skosif.js" in sw
          # iPhone & laptop: device core, keyboard, encrypted transfer, install guides, manifest shortcuts
          for marker in ["SK.device=","beforeinstallprompt","SKosifKeys","skosif-transfer","AES-GCM","toggleRail","setTabs"]:
              assert marker in js, "device marker missing: "+marker
          assert 'SK.view("devices"' in js, "devices screen missing"
          for f in ["INSTALL-iPHONE-ar.txt","INSTALL-LAPTOP-ar.txt"]:
              assert Path("dist",f).exists(), f
          mf=json.loads(manifest)
          assert mf.get("orientation")!="portrait" and mf.get("shortcuts") and "window-controls-overlay" in mf.get("display_override",[]), "manifest must serve laptop and iPhone"
          assert all(s["url"].startswith("./?") for s in mf["shortcuts"]), "manifest shortcuts must be deep links"
          assert ":root[data-look=\"kosif\"] .skb" not in css, "the phone tab bar must work in every theme"
          # KOSIF Luxe: shared components, new screens, report pack, letterhead, sign-in page
          # no capability is lost: every id in the baseline stays registered and reachable
          base=[l.split("\t")[0] for l in Path("docs/rebuild/CAPABILITY_BASELINE.txt").read_text(encoding="utf-8").splitlines() if l and not l.startswith("#")]
          ids={c["id"] for c in caps}
          lost=[x for x in base if x not in ids]
          assert not lost, "capabilities lost (restore them or remove them from the baseline on purpose): "+", ".join(lost)
          assert not [c["id"] for c in caps if c["id"] not in base], "new capability: add it to docs/rebuild/CAPABILITY_BASELINE.txt"
          # demo data: marked, removable, never over real data
          for marker in ["SK.demo=","skosif_demo_v1","dropDemo","SK.templates=","SQC-template-","function book(","SKosifSalesLab","function matrix(","SK.flow=","skflow","SK.output=","skout-f","application/msword"]:
              assert marker in js, "demo marker missing: "+marker
          # the work flow graph: every "feeds" target is a real capability
          for c in caps:
              for f in c.get("feeds",[]): assert f in ids, "bad feeds "+c["id"]+" → "+f
          # the AI audit council inside the engagement (research «مجلس المراجعة الذكي») and the fused audit hub
          for marker in ["SKosifCouncilUI","confidenceMatrix","stopRule","verifyOpinion","integrityChecks","mountStudio","formDialog"]:
              assert marker in js, "council marker missing: "+marker
          assert any(c.get("hidden") and c.get("hub")=="tbreview" for c in caps), "the audit studio lives inside the engagement"
          # books you can rely on: reversal instead of deletion, a lock date, VAT taken out of the price paid, cost of sales with each sale
          for marker in ["reverseJournalEntry","isPeriodLocked","splitVatInclusive","priceIncludesVat","weightedAverageCosts","rev-entry","lockHTML",
                         "partyBalances","partyStatement","buildSettlementEntry","buildVatSettlementEntry","cashHTML","data-ledger-open",
                         "matchBankLines","bankReconciliationStatement","bankHTML","stockCountValuation","buildStockCountAdjustment","weightedAverageCostsAsOf",
                         "SKosifClose","skclose-steps","skbrief","booksHTML","syncStudio","recolorStudio","docAIHTML","tbr-adv"]:
              assert marker in js, "ledger control missing: "+marker
          assert 'data-l="del-entry"' not in js, "posted entries are reversed, never deleted"
          # global audit practice from the research bundle, as working tools: the materiality plan and the retrospective review
          # of estimates (fieldwork), going concern and viability (completion), key audit matters drafted from the line risks
          # and the global precedents, and in the books the journal's audit trail (edit log) and the revenue reconciliation
          for marker in ["planMateriality","suggestKams","assessGoingConcern","goingConcernSection","reviewEstimates","reconcileRevenue",
                         "verifyChain","sealNew","externalInserts","SKosifAuditPractice","trailHTML","revReconHTML","kamList"]:
              assert marker in js, "audit practice marker missing: "+marker
          for marker in ["SKosifTopbar","SKCharts","SKosifTable","SKosifNotify","SKosifReportPack","SKosifMetrics","skp-band","counter(pages)"]:
              assert marker in js, "luxe marker missing: "+marker
          for marker in ["--sk-heat-1",".sk-ph",".skk4",".sktb-bar",".skhm-cell",".sksev"]:
              assert marker in css, "luxe style missing: "+marker
          assert "AI-Powered Audit &amp; Assurance Platform" in unlock, "sign-in page lost the SQC claim"
          # live assistant, theme studio, charts v2, tables v2 (Excel), print preview
          for marker in ["SKosifAssistant","functionDeclarations","accentTokens","waterfall","exportXlsx","rightToLeft","skp-bar","__skRealPrint"]:
              assert marker in js, "marker missing: "+marker
          for marker in ["--sk-c1",".ska-panel",".skx-studio","sktb-cards","data-contrast"]:
              assert marker in css, "style missing: "+marker
          assert all(c.get("en") for c in caps), "every screen needs its English name (en)"
          # hubs: a page names a parent in its own domain; parents are menu entries with a hub label
          byid={c["id"]:c for c in caps}
          for c in caps:
              if c.get("hub"):
                  h=byid.get(c["hub"]); assert h and not h.get("hub") and h["group"]==c["group"], "bad hub for "+c["id"]
                  assert h.get("hubLabel"), "hub without hubLabel: "+h["id"]
          # accounting & audit: three vendored apps, loaded on first use from dist/audit
          for f in ["audit/mount.js","audit/app.css","audit/markup.html","audit/classic/mount.js","audit/lab/mount.js"]:
              assert Path("dist",f).exists(), f
          for view in ["auditdesk","auditdocs","auditissues","auditcouncil","auditfin","auditreport","auditanalytics","auditlab"]:
              assert '["'+view+'"' in js, "audit screen missing: "+view
          audit_js="\n".join(p.read_text(encoding="utf-8") for p in Path("dist/audit").rglob("*.js"))
          assert "document.querySelector(" not in audit_js, "audit studio must query its own shadow root"
          print("S.kosif validation: OK")
          PY

      - name: UI smoke test (every screen, laptop and phone, demo data)
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1
          npx --prefix /tmp/pw playwright install --with-deps chromium
          (python3 -m http.server 8765 --directory dist >/dev/null 2>&1 &)
          sleep 2
          NODE_PATH=/tmp/pw/node_modules node tools/ui_smoke.mjs http://localhost:8765/app-safe.html
          NODE_PATH=/tmp/pw/node_modules node tools/feature_audit.mjs http://localhost:8765/app-safe.html
          NODE_PATH=/tmp/pw/node_modules node tools/jesim_e2e.mjs http://localhost:8765/app-safe.html
