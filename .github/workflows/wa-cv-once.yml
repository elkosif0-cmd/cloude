name: KOSIF WhatsApp CV One-Time

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  send:
    if: github.event.issue.title == '[WA-CV-ONCE]'
    runs-on: ubuntu-latest
    steps:
      - name: Send exact message
        env:
          DISPATCH_TOKEN: ${{ secrets.WA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg to "201023082293" \
            --arg message " السلام عليكم ازي حضرتك عامل ايه انا محاسب بشتغل في جدة بدور على شغل ياريت لو قدامك اي فرصة شغل لي لاني شغلي حاليا متعب جدا في مؤسسة صغيره " \
            '{to:$to,message:$message}')
          CODE=$(curl -sS -o text.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://wa-kosif-dispatch.kosif199022.workers.dev/send")
          cat text.json
          test "$CODE" -ge 200 -a "$CODE" -lt 300

      - name: Send Arabic CV
        env:
          DISPATCH_TOKEN: ${{ secrets.WA_DISPATCH_TOKEN }}
          FILE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-528c-8211-b89c-460d08802dfb/raw?se=2026-09-25T17%3A39%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=9b5eacc0-ba03-5ea6-b325-a5ed6f41b1d4&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T13%3A29%3A57Z&ske=2026-09-26T13%3A29%3A57Z&sks=b&skv=2026-02-06&sig=HQ9NJUUmCsrH31eAS/Wq18SxUowXG7Hv6eT7Y9eQvTs%3D"
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg to "201023082293" \
            --arg fileUrl "$FILE_URL" \
            --arg filename "Mahmoud_ElDesouki_CV_Arabic_2026.pdf" \
            --arg mimetype "application/pdf" \
            '{to:$to,fileUrl:$fileUrl,filename:$filename,mimetype:$mimetype,caption:""}')
          CODE=$(curl -sS -o ar.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://wa-kosif-dispatch.kosif199022.workers.dev/send-media")
          cat ar.json
          test "$CODE" -ge 200 -a "$CODE" -lt 300

      - name: Send English CV
        env:
          DISPATCH_TOKEN: ${{ secrets.WA_DISPATCH_TOKEN }}
          FILE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-d44c-8211-92c0-57c3d39ee834/raw?se=2026-09-25T17%3A39%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=28cb5175-8580-54fe-a1a5-e50d0c04b704&skoid=37f774a3-b6f2-4e56-9fdd-339e5d6e97f8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T11%3A04%3A51Z&ske=2026-09-26T11%3A04%3A51Z&sks=b&skv=2026-02-06&sig=WhGRBrvrUkpE7bFZhFwNiNeAsxUbnuK3OLmaOxrryLI%3D"
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg to "201023082293" \
            --arg fileUrl "$FILE_URL" \
            --arg filename "Mahmoud_ElDesouki_CV_English_2026.pdf" \
            --arg mimetype "application/pdf" \
            '{to:$to,fileUrl:$fileUrl,filename:$filename,mimetype:$mimetype,caption:""}')
          CODE=$(curl -sS -o en.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://wa-kosif-dispatch.kosif199022.workers.dev/send-media")
          cat en.json
          test "$CODE" -ge 200 -a "$CODE" -lt 300

      - name: Mark complete
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ Message + Arabic CV + English CV sent."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Mark failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ CV send failed. Check Actions."
