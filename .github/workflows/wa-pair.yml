name: KOSIF WhatsApp Pair Helper

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  pair:
    if: github.event.issue.title == '[PAIR]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pairing QR
        env:
          DISPATCH_TOKEN: ${{ secrets.WA_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $DISPATCH_TOKEN" \
            "https://wa-kosif-dispatch.kosif199022.workers.dev/pair/qr" > pair.json
          if jq -e '.linked == true' pair.json >/dev/null; then
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "PAIR_LINKED"
          else
            QR=$(jq -r '.qr // empty' pair.json)
            test -n "$QR"
            ENC=$(printf '%s' "$QR" | base64 -w0)
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "PAIR_QR_B64=$ENC"
          fi

  paircode:
    if: github.event.issue.title == '[PAIRCODE]'
    runs-on: ubuntu-latest
    steps:
      - name: Request phone pairing code
        env:
          DISPATCH_TOKEN: ${{ secrets.WA_DISPATCH_TOKEN }}
          BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > body.json
          PHONE=$(jq -r '.phone // empty' body.json)
          test -n "$PHONE"
          HTTP=$(curl -sS -o result.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg phone "$PHONE" '{phone:$phone}')" \
            "https://wa-kosif-dispatch.kosif199022.workers.dev/pair/code")
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            CODE=$(jq -r '.code // empty' result.json)
            test -n "$CODE"
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "PAIR_CODE=$CODE"
          else
            ERR=$(jq -r '.error // "pairing failed"' result.json)
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "PAIR_ERROR=$ERR"
            exit 1
          fi
