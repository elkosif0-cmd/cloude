# One-shot: deletes the temporary branch research-tmp-ingest (page text used for study). Removed right after it runs.
name: Remove temporary research branch (one-shot)
on:
  push:
    branches: [claude/magical-maxwell-taj9xe]
    paths: [".github/workflows/cleanup-research-branch.yml"]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/research-tmp-ingest")
          echo "DELETE refs/heads/research-tmp-ingest -> $code"
          [ "$code" = "204" ] || [ "$code" = "422" ] || [ "$code" = "404" ]
