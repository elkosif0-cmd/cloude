name: KOSIF WhatsApp Queue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  send:
    if: startsWith(github.event.issue.title, '[WA]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and send WhatsApp message
        env:
          DISPATCH_TOKEN: ${{ secrets.WA_DISPATCH_TOKEN }}
          BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          test -n "$DISPATCH_TOKEN"
          printf '%s' "$BODY" | jq -e 'type=="object" and (.to|type=="string") and (.message|type=="string") and (.message|length>0)' >/dev/null
          CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "https://wa-kosif-dispatch.kosif199022.workers.dev/send")
          cat response.json
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "Dispatcher returned HTTP $CODE" >&2
            exit 1
          fi

      - name: Mark sent
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "✅ WhatsApp message sent."
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Mark failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ WhatsApp send failed. Check the Actions run."
