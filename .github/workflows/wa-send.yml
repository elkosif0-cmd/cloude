name: KOSIF WhatsApp Queue

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  send:
    if: startsWith(github.event.issue.title, '[WA]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stored files
        uses: actions/checkout@v4
        with:
          sparse-checkout: .private-assets/whatsapp

      - name: Send WhatsApp payload
        env:
          DISPATCH_TOKEN: ${{ secrets.WA_DISPATCH_TOKEN }}
          BODY: ${{ github.event.issue.body }}
          IDEMPOTENCY_KEY: gh-issue-${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          test -n "$DISPATCH_TOKEN"
          printf '%s' "$BODY" > request.json

          jq -e '
            type=="object" and
            (.to|type=="string") and
            ((.message // "")|type=="string") and
            ((.attachments // [])|type=="array") and
            ((.attachments // []) | all(. == "cv-ar" or . == "cv-en"))
          ' request.json >/dev/null

          # One request sends the text and every attachment, in order. The issue number is the
          # idempotency key, so a re-run never delivers the same item twice.
          send() {
            curl -sS -o result.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @payload.json \
              "https://wa-kosif-dispatch.kosif199022.workers.dev/send-bundle"
          }

          # Preferred: the bridge reads the CVs from R2.
          jq --arg key "$IDEMPOTENCY_KEY" \
            '{to, message: (.message // ""), attachments: (.attachments // []), idempotencyKey: $key}' \
            request.json > payload.json
          CODE=$(send)

          # 424 = the CVs are not in R2 yet (nothing was sent). Send them from the repo instead.
          if [ "$CODE" = "424" ]; then
            echo "Stored files unavailable ($(jq -r .error result.json)); sending from repository."
            ATTACH='[]'
            for KEY in $(jq -r '.attachments // [] | .[]' request.json); do
              case "$KEY" in
                cv-ar) FILE=".private-assets/whatsapp/CV-Arabic.pdf";  NAME="Mahmoud_ElDesouki_CV_Arabic_2026.pdf" ;;
                cv-en) FILE=".private-assets/whatsapp/CV-English.pdf"; NAME="Mahmoud_ElDesouki_CV_English_2026.pdf" ;;
              esac
              test -f "$FILE"
              base64 -w0 "$FILE" > file.b64
              ATTACH=$(jq -c --rawfile b64 file.b64 --arg name "$NAME" \
                '. + [{fileBase64: $b64, filename: $name, mimetype: "application/pdf"}]' <<<"$ATTACH")
            done
            jq --arg key "$IDEMPOTENCY_KEY" --slurpfile att <(printf '%s' "$ATTACH") \
              '{to, message: (.message // ""), attachments: $att[0], idempotencyKey: $key}' \
              request.json > payload.json
            CODE=$(send)
          fi

          jq -c '{sent, duplicate, results, error}' result.json || cat result.json
          test "$CODE" -ge 200 -a "$CODE" -lt 300

      - name: Close request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Mark failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "❌ WhatsApp send failed. Check the Actions run."
