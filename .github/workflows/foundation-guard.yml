name: Foundation Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical product charter and agent preflight files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "FOUNDATION.md"
            "AGENTS.md"
            "CLAUDE.md"
            "GEMINI.md"
            ".github/copilot-instructions.md"
            ".github/pull_request_template.md"
          )

          for f in "${required_files[@]}"; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done

          grep -qi "CANONICAL / MUST READ BEFORE ANY WORK" FOUNDATION.md             || { echo "::error::FOUNDATION.md lost canonical status marker"; exit 1; }

          for f in AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md; do
            grep -q "FOUNDATION.md" "$f"               || { echo "::error::$f no longer points agents to FOUNDATION.md"; exit 1; }
          done

          grep -q "FOUNDATION.md" .github/pull_request_template.md             || { echo "::error::PR template no longer requires foundation acknowledgment"; exit 1; }

          echo "Foundation guard passed."

  constitution-guard:
    # رادع الدستور: every FOUNDATION rule mapped to the test or check that enforces it (docs/registry/constitution-rules.json);
    # fails when a checked rule fails or when fewer rules are enforced than tools/fixtures/constitution-baseline.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Constitution guard
        run: node tools/constitution_guard.mjs --check
      - name: Scorecard
        if: always()
        run: cat docs/registry/CONSTITUTION_SCORECARD_ar.md >> "$GITHUB_STEP_SUMMARY"
