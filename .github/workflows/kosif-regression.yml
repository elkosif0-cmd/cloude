name: KOSIF Regression

on:
  push:
    paths:
      - 'think-mcp/**'
      - '.github/workflows/kosif-regression.yml'
  pull_request:
    paths:
      - 'think-mcp/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check runtime
        run: node --check think-mcp/worker.js
      - name: Syntax check secure executor
        run: node --check think-mcp/secure-executor/worker.js
      - name: 0.17.3 governance regression
        run: node think-mcp/regression-0173.test.mjs
