name: Temporary rebuild engines

on:
  push:
    branches:
      - codex/report-compatibility-49
    paths:
      - ".github/workflows/rebuild-engines-temp.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/report-compatibility-49
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Rebuild browser engine bundle
        run: node tools/build_engines.mjs
      - name: Commit generated engine bundle
        run: |
          git config user.name "sqc-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/engine/fusion/index.ts ui/core/engines.js
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate browser engine bundle"
          git push origin HEAD:codex/report-compatibility-49
