name: KOSIF WhatsApp Bridge Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wa-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
        with:
          ref: claude/whatsapp-integration-messaging-mvdnxr

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker and Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "9ff3d8494afab356ecbf95a2a231a6b5"
        working-directory: whatsapp-bridge
        run: |
          set -euo pipefail
          TOKEN="${CLOUDFLARE_API_TOKEN:-${CF_API_TOKEN:-${CLOUDFLARE_TOKEN:-}}}"
          if [ -z "$TOKEN" ]; then
            echo "No Cloudflare API token secret is configured." >&2
            exit 42
          fi
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          npm install
          npx wrangler deploy
