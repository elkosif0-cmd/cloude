name = "s-kosif-capabilities-v2"
main = "capabilities-v2/worker.js"
compatibility_date = "2026-09-25"
workers_dev = true

# Bind after creating the D1 database:
# [[d1_databases]]
# binding = "DB"
# database_name = "s-kosif-capabilities-v2"
# database_id = "<D1_DATABASE_ID>"

# Optional Cloudflare Access verification:
# [vars]
# TEAM_DOMAIN = "https://<team>.cloudflareaccess.com"
# POLICY_AUD = "<application-audience>"
# ALLOWED_ORIGINS = "https://s-kosif.pages.dev"

# Required for the server-side document vault. The API fails closed when this binding is absent.
# [[r2_buckets]]
# binding = "DOCUMENTS"
# bucket_name = "s-kosif-documents"

# Claude financial reviewer: rate-limit requests per signed user + workspace.
# The Workers Rate Limiting API requires Wrangler >= 4.36.0.
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "2026101201"

[ratelimits.simple]
limit = 5
period = 60

# Do not store the Claude API key here. Configure ANTHROPIC_API_KEY
# as a Cloudflare Worker SECRET, and configure Cloudflare Access TEAM_DOMAIN
# and POLICY_AUD for the Worker route. Without these bindings AI fails closed.
# [vars]
# ANTHROPIC_MODEL = "claude-opus-5-5"
